aid: 42maru
name: 42Maru
description: >-
  42Maru is a South Korean AI deep-tech company building a Deep Semantic TA (Text
  Analytics) and QA (Question Answering) platform that understands the true intent
  behind a user's question and returns a single answer drawn from large sets of
  unstructured documents. Its cognitive-search stack pairs document retrieval with
  Machine Reading Comprehension (MRC) and is delivered as enterprise chatbots
  (CHAT42), question-answering engines (QA42), natural-language processing (NL42),
  and the Platform42 SaaS. 42Maru ranked #1 on Stanford's SQuAD 2.0 machine-reading
  benchmark, won an AWS AI Challenge award, and is a Techstars London alumnus. It
  was added to the API Evangelist network from the Techstars portfolio and enriched
  from its public marketing site, GitHub organizations, and gitbook documentation;
  no public REST API, OpenAPI, first-party SDK, or /.well-known discovery surface
  was found — Platform42 API access appears to be provisioned per enterprise customer.
